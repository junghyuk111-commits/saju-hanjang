<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주한장 · 운영자 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: #2e2e38;
  --gold: #c9933a;
  --gold2: #e8c47a;
  --red: #9b2a1a;
  --text: #e8e0d0;
  --muted: #7a7060;
  --green: #3a8c5a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
}

/* ── Sidebar ── */
.layout { display:flex; min-height:100vh; }
.sidebar {
  width: 220px; flex-shrink:0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 32px 0;
  display:flex; flex-direction:column;
}
.sidebar-logo {
  text-align:center;
  padding: 0 20px 28px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo .sym { font-size:1.8rem; display:block; margin-bottom:6px; }
.sidebar-logo h2 {
  font-family:'Noto Serif KR',serif;
  font-size:1rem; font-weight:700;
  letter-spacing:.15em; color:var(--gold);
}
.sidebar-logo span { font-size:.7rem; color:var(--muted); letter-spacing:.05em; }
.sidebar-nav { padding:20px 0; flex:1; }
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:11px 24px;
  font-size:.85rem; color:var(--muted);
  cursor:pointer; transition:all .15s;
  border-left:3px solid transparent;
}
.nav-item.active {
  color:var(--gold); border-left-color:var(--gold);
  background:rgba(201,147,58,.07);
}
.nav-item:hover { color:var(--text); }
.sidebar-bottom {
  padding:16px 20px;
  border-top:1px solid var(--border);
  font-size:.72rem; color:var(--muted); text-align:center;
}

/* ── Main ── */
.main { flex:1; overflow-y:auto; }
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 32px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  position:sticky; top:0; z-index:10;
}
.topbar h1 { font-family:'Noto Serif KR',serif; font-size:1.1rem; font-weight:600; }
.topbar .badge {
  background:rgba(201,147,58,.15);
  border:1px solid rgba(201,147,58,.3);
  color:var(--gold2);
  font-size:.72rem; padding:4px 12px; border-radius:20px;
}

.content { padding:28px 32px; max-width:780px; }

/* ── Steps ── */
.steps {
  display:flex; gap:0; margin-bottom:32px;
}
.step {
  display:flex; align-items:center; gap:10px;
  flex:1;
}
.step-num {
  width:28px; height:28px;
  border-radius:50%;
  background:var(--border);
  color:var(--muted);
  display:flex; align-items:center; justify-content:center;
  font-size:.75rem; font-weight:600; flex-shrink:0;
  transition:all .3s;
}
.step.done .step-num { background:var(--green); color:white; }
.step.active .step-num { background:var(--gold); color:var(--bg); }
.step-label { font-size:.78rem; color:var(--muted); }
.step.active .step-label { color:var(--gold2); }
.step.done .step-label { color:var(--text); }
.step-line { flex:1; height:1px; background:var(--border); margin:0 8px; }

/* ── Card ── */
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:24px;
  margin-bottom:20px;
}
.card-title {
  font-family:'Noto Serif KR',serif;
  font-size:.95rem; font-weight:600;
  color:var(--gold2);
  margin-bottom:18px;
  display:flex; align-items:center; gap:8px;
}

/* ── Form ── */
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.form-row.three { grid-template-columns:1fr 1fr 1fr; }
.form-group { display:flex; flex-direction:column; gap:6px; }
label {
  font-size:.75rem; color:var(--muted);
  letter-spacing:.05em; font-weight:500;
}
input, select, textarea {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:5px;
  padding:10px 14px;
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  font-size:.88rem;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
  width:100%;
}
input:focus, select:focus, textarea:focus {
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,147,58,.12);
}
textarea { resize:vertical; min-height:80px; line-height:1.7; }
select option { background:var(--surface2); }

.concern-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.ctag {
  padding:6px 14px;
  border:1px solid var(--border);
  border-radius:20px;
  font-size:.78rem; color:var(--muted);
  cursor:pointer; transition:all .15s;
}
.ctag:hover { border-color:var(--gold); color:var(--gold2); }
.ctag.on {
  background:rgba(201,147,58,.15);
  border-color:var(--gold);
  color:var(--gold2);
}

/* ── Buttons ── */
.btn-primary {
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 28px;
  background:linear-gradient(135deg, var(--red), #7a1f12);
  color:white; border:none; border-radius:5px;
  font-family:'Noto Serif KR',serif;
  font-size:.95rem; font-weight:600;
  letter-spacing:.1em; cursor:pointer;
  transition:all .2s;
}
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(155,42,26,.4); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }

.btn-gold {
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 28px;
  background:linear-gradient(135deg, var(--gold), #a07020);
  color:var(--bg); border:none; border-radius:5px;
  font-family:'Noto Serif KR',serif;
  font-size:.95rem; font-weight:700;
  letter-spacing:.08em; cursor:pointer;
  transition:all .2s;
}
.btn-gold:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(201,147,58,.35); }

.btn-outline {
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 22px;
  background:transparent;
  color:var(--muted); border:1px solid var(--border); border-radius:5px;
  font-size:.85rem; cursor:pointer; transition:all .15s;
}
.btn-outline:hover { border-color:var(--gold); color:var(--gold2); }

/* ── Progress ── */
.progress-box {
  display:none;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:32px 24px;
  text-align:center;
  margin-bottom:20px;
}
.progress-box.show { display:block; }
.prog-spinner {
  width:44px; height:44px;
  border:3px solid var(--border);
  border-top-color:var(--gold);
  border-radius:50%;
  margin:0 auto 16px;
  animation:spin .9s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.prog-text { color:var(--muted); font-size:.88rem; }
.prog-sub { font-size:.78rem; color:var(--muted); margin-top:6px; opacity:.7; }

/* ── Result preview ── */
.result-area {
  display:none;
  margin-bottom:20px;
}
.result-area.show { display:block; }
.result-preview {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:20px;
  max-height:600px;
  overflow-y:auto;
  font-size:.85rem;
  line-height:2;
  color:#c8bfb0;
  white-space:pre-wrap;
  margin-bottom:16px;
}
.result-preview strong { color:var(--gold2); }
.action-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }

/* ── Pillars mini ── */
.pillars-mini { display:flex; gap:6px; margin-bottom:16px; }
.pill {
  width:44px; text-align:center;
  border:1px solid var(--border); border-radius:4px; overflow:hidden;
}
.pill .s {
  background:var(--red); color:white;
  font-family:'Noto Serif KR',serif; font-size:.95rem;
  padding:6px 0;
}
.pill .b {
  background:rgba(201,147,58,.12); color:var(--text);
  font-family:'Noto Serif KR',serif; font-size:.95rem;
  padding:6px 0; border-top:1px solid var(--border);
}
.pill-lbl { font-size:.65rem; color:var(--muted); text-align:center; margin-top:3px; }

/* ── History ── */
.history-list { display:flex; flex-direction:column; gap:10px; }
.history-item {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:6px; padding:12px 16px;
  font-size:.82rem;
}
.history-item .name { font-weight:500; color:var(--text); }
.history-item .meta { color:var(--muted); font-size:.75rem; margin-top:2px; }
.history-item .dl-btn {
  padding:5px 14px;
  background:rgba(201,147,58,.12);
  border:1px solid rgba(201,147,58,.3);
  color:var(--gold2); border-radius:4px;
  font-size:.75rem; cursor:pointer; transition:all .15s;
  white-space:nowrap;
}
.history-item .dl-btn:hover { background:rgba(201,147,58,.25); }

.empty-state { text-align:center; padding:28px; color:var(--muted); font-size:.85rem; }

@media(max-width:640px) {
  .sidebar { display:none; }
  .content { padding:16px; }
  .form-row { grid-template-columns:1fr; }
  .form-row.three { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>
<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="/logo.png" style="width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 8px;">
    <h2>사주한장</h2>
    <span>운영자 전용</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active">✦ 새 풀이 생성</div>
    <div class="nav-item" onclick="showHistory()">📋 생성 기록</div>
  </nav>
  <div class="sidebar-bottom">사주한장 · v1.0</div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <h1>사주 풀이 생성</h1>
    <span class="badge">⚡ AI 자동 생성</span>
  </div>

  <div class="content">

    <!-- Steps -->
    <div class="steps">
      <div class="step active" id="step1">
        <div class="step-num">1</div>
        <div class="step-label">정보 입력</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step2">
        <div class="step-num">2</div>
        <div class="step-label">AI 분석</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step3">
        <div class="step-num">3</div>
        <div class="step-label">페이지 생성</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step4">
        <div class="step-num">4</div>
        <div class="step-label">전달</div>
      </div>
    </div>

    <!-- 입력 폼 -->
    <div id="formSection">
      <div class="card">
        <div class="card-title">👤 의뢰인 기본 정보</div>
        <div class="form-row">
          <div class="form-group">
            <label>이름</label>
            <input type="text" id="name" placeholder="홍길동">
          </div>
          <div class="form-group">
            <label>성별</label>
            <select id="gender">
              <option value="남">남성</option>
              <option value="여">여성</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="birth" max="2010-12-31">
          </div>
          <div class="form-group">
            <label>출생 시간</label>
            <select id="btime">
              <option value="모름">모름 / 불분명</option>
              <option value="자시(23~01시)">자시 (밤 11~1시)</option>
              <option value="축시(01~03시)">축시 (새벽 1~3시)</option>
              <option value="인시(03~05시)">인시 (새벽 3~5시)</option>
              <option value="묘시(05~07시)">묘시 (새벽 5~7시)</option>
              <option value="진시(07~09시)">진시 (오전 7~9시)</option>
              <option value="사시(09~11시)">사시 (오전 9~11시)</option>
              <option value="오시(11~13시)">오시 (오전 11~오후 1시)</option>
              <option value="미시(13~15시)">미시 (오후 1~3시)</option>
              <option value="신시(15~17시)">신시 (오후 3~5시)</option>
              <option value="유시(17~19시)">유시 (오후 5~7시)</option>
              <option value="술시(19~21시)">술시 (저녁 7~9시)</option>
              <option value="해시(21~23시)">해시 (밤 9~11시)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🎯 관심 분야</div>
        <div class="concern-wrap" id="concerns">
          <span class="ctag on" data-v="전체운">🌟 전체운</span>
          <span class="ctag" data-v="재물운">💰 재물운</span>
          <span class="ctag" data-v="연애·결혼운">❤️ 연애·결혼</span>
          <span class="ctag" data-v="직업·사업운">💼 직업·사업</span>
          <span class="ctag" data-v="건강운">🌿 건강운</span>
          <span class="ctag" data-v="가족운">🏠 가족운</span>
          <span class="ctag" data-v="올해운세">📅 올해운세</span>
          <span class="ctag" data-v="이사·이직운">🔄 이사·이직</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">💬 의뢰인 추가 메모 (선택)</div>
        <div class="form-group">
          <label>당근 채팅에서 받은 고민이나 특이사항</label>
          <textarea id="memo" placeholder="예: 올해 이직을 고민 중, 연애 고민 있음, 사업 시작 예정 등"></textarea>
        </div>
      </div>

      <button class="btn-primary" id="genBtn" onclick="generate()">
        ✦ AI 사주 풀이 생성하기
      </button>
    </div>

    <!-- 생성 중 -->
    <div class="progress-box" id="progBox">
      <div class="prog-spinner"></div>
      <div class="prog-text">사주를 읽는 중입니다…</div>
      <div class="prog-sub" id="progSub">사주팔자 계산 중</div>
    </div>

    <!-- 결과 -->
    <div class="result-area" id="resultArea">
      <div class="card">
        <div class="card-title">✅ 생성 완료 — <span id="resName" style="color:var(--text)"></span>님 사주</div>
        <div class="pillars-mini" id="pillarsPreview"></div>
        <div class="result-preview" id="resPreview"></div>
        <div class="action-row">
          <button class="btn-gold" onclick="downloadPage()">⬇ 의뢰인 전용 페이지 다운로드</button>
          <button class="btn-outline" onclick="resetAll()">↺ 새 의뢰인</button>
        </div>
        <p style="margin-top:12px;font-size:.75rem;color:var(--muted)">
          💡 다운로드한 HTML 파일을 Netlify Drop(netlify.com/drop)에 드래그하면 즉시 URL 생성됩니다.
        </p>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->
</div><!-- /layout -->

<script>
// ── 사주 계산 ──
const ST=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BR=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const STk=['갑','을','병','정','무','기','경','신','임','계'];
const BRk=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const EL=['목','목','화','화','토','토','금','금','수','수'];
const ELcol=['#5a8a3a','#5a8a3a','#c9503a','#c9503a','#c9933a','#c9933a','#8a8a9a','#8a8a9a','#3a6a9a','#3a6a9a'];

function ySB(y){const s=((y-4)%10+10)%10,b=((y-4)%12+12)%12;return{s:ST[s],b:BR[b],sk:STk[s],bk:BRk[b],ei:s};}
function mSB(y,m){const base=(y-1900)*12+(m-1);const s=(base+2)%10,b=(m+1)%12;return{s:ST[(s+10)%10],b:BR[b],sk:STk[(s+10)%10],bk:BRk[b],ei:(s+10)%10};}
function dSB(date){const base=Math.floor((date-new Date(1900,0,1))/86400000)+10;const s=((base%10)+10)%10,b=((base%12)+12)%12;return{s:ST[s],b:BR[b],sk:STk[s],bk:BRk[b],ei:s};}
const HIDX={'자시(23~01시)':0,'축시(01~03시)':1,'인시(03~05시)':2,'묘시(05~07시)':3,'진시(07~09시)':4,'사시(09~11시)':5,'오시(11~13시)':6,'미시(13~15시)':7,'신시(15~17시)':8,'유시(17~19시)':9,'술시(19~21시)':10,'해시(21~23시)':11};
function hSB(dayStem,tv){if(tv==='모름')return null;const bi=HIDX[tv]??0,di=ST.indexOf(dayStem),si=((di%5)*2+10)%10;return{s:ST[(si+bi)%10],b:BR[bi],sk:STk[(si+bi)%10],bk:BRk[bi],ei:(si+bi)%10};}

// ── Concern toggle ──
document.querySelectorAll('.ctag').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));

let lastData=null;
const history=[];

async function generate(){
  const name=document.getElementById('name').value.trim()||'의뢰인';
  const gender=document.getElementById('gender').value;
  const birth=document.getElementById('birth').value;
  const btime=document.getElementById('btime').value;
  const memo=document.getElementById('memo').value.trim();
  if(!birth){alert('생년월일을 입력해 주세요.');return;}
  const concerns=[...document.querySelectorAll('.ctag.on')].map(t=>t.dataset.v);
  if(!concerns.length){alert('관심 분야를 선택해 주세요.');return;}

  const bd=new Date(birth);
  const y=bd.getFullYear(),m=bd.getMonth()+1,d=bd.getDate();
  const ysb=ySB(y),msb=mSB(y,m),dsb=dSB(bd),hsb=hSB(dsb.s,btime);

  // Step UI
  setStep(2);
  document.getElementById('formSection').style.display='none';
  document.getElementById('progBox').classList.add('show');
  document.getElementById('resultArea').classList.remove('show');

  const progSub=document.getElementById('progSub');
  const msgs=['사주팔자 계산 중…','오행 균형 분석 중…','대운 세운 파악 중…','풀이 작성 중…'];
  let mi=0;
  const interval=setInterval(()=>{if(mi<msgs.length)progSub.textContent=msgs[mi++];},1800);

  const sajuStr=hsb
    ?`연주 ${ysb.s}${ysb.b}(${ysb.sk}${ysb.bk}), 월주 ${msb.s}${msb.b}(${msb.sk}${msb.bk}), 일주 ${dsb.s}${dsb.b}(${dsb.sk}${dsb.bk}), 시주 ${hsb.s}${hsb.b}(${hsb.sk}${hsb.bk})`
    :`연주 ${ysb.s}${ysb.b}(${ysb.sk}${ysb.bk}), 월주 ${msb.s}${msb.b}(${msb.sk}${msb.bk}), 일주 ${dsb.s}${dsb.b}(${dsb.sk}${dsb.bk}) (시주 불명)`;

  const prompt=`당신은 20년 이상 경력의 한국 명리학 전문가입니다. 의뢰인과 직접 마주 앉아 이야기하듯, 따뜻하고 자연스러운 말투로 사주를 풀이해 주세요.

【중요한 말투 지침】
- "~입니다" 보다는 "~이에요", "~네요", "~거든요", "~답니다" 같은 부드러운 표현을 주로 쓰세요.

function setStep(n){
  for(let i=1;i<=4;i++){
    const el=document.getElementById('step'+i);
    el.className='step'+(i<n?' done':i===n?' active':'');
  }
}

function downloadPage(){
  if(!lastData)return;
  const {name,gender,y,m,d,btime,concerns,ysb,msb,dsb,hsb,raw}=lastData;
  const html=buildClientPage(name,gender,y,m,d,btime,concerns,ysb,msb,dsb,hsb,raw);
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`사주한장_${name}_사주풀이.html`;
  a.click();
  setStep(4);
  setTimeout(()=>{
    document.getElementById('resultArea').querySelector('.action-row').insertAdjacentHTML('beforeend',
      `<span style="color:#3a8c5a;font-size:.8rem">✓ 다운로드 완료! Netlify Drop에 업로드하세요.</span>`);
  },300);

// ── 오행 계산 ──
function calcOheng(ysb,msb,dsb,hsb){
  const map={
    '甲':'목','乙':'목','丙':'화','丁':'화','戊':'토','己':'토','庚':'금','辛':'금','壬':'수','癸':'수',
    '子':'수','丑':'토','寅':'목','卯':'목','辰':'토','巳':'화','午':'화','未':'토','申':'금','酉':'금','戌':'토','亥':'수'
  };
  const cnt={목:0,화:0,토:0,금:0,수:0};
  [ysb,msb,dsb,hsb].forEach(sb=>{
    if(!sb)return;
    cnt[map[sb.s]||'토']=(cnt[map[sb.s]||'토']||0)+1;
    cnt[map[sb.b]||'토']=(cnt[map[sb.b]||'토']||0)+1;
  });
  const total=Object.values(cnt).reduce((a,b)=>a+b,0)||1;
  const r={};
  Object.keys(cnt).forEach(k=>r[k]=Math.round(cnt[k]/total*100));
  return r;
}
