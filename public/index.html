<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주한장 · 운영자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f7f4;
  --white: #ffffff;
  --ink: #1a1410;
  --gold: #b8862a;
  --gold-light: #f0e4c4;
  --red: #8b2020;
  --muted: #6b6058;
  --border: #e4ddd4;
  --surface: #faf9f6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

/* Layout */
.layout { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 0;
}
.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-header img { width: 40px; height: 40px; object-fit: contain; }
.sidebar-header .brand-text h2 {
  font-family: 'Noto Serif KR', serif;
  font-size: .95rem; font-weight: 700;
  color: var(--ink); letter-spacing: .05em;
}
.sidebar-header .brand-text span { font-size: .7rem; color: var(--muted); }
.sidebar-nav { flex: 1; padding: 16px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px;
  font-size: .84rem; color: var(--muted);
  cursor: pointer; transition: all .15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.active { background: var(--gold-light); color: var(--gold); font-weight: 600; }
.nav-item .icon { font-size: 1rem; }
.sidebar-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  font-size: .72rem; color: var(--muted);
}

/* Main */
.main { flex: 1; overflow-y: auto; }
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.topbar h1 { font-family: 'Noto Serif KR', serif; font-size: 1.1rem; font-weight: 600; }
.badge {
  background: var(--gold-light);
  color: var(--gold);
  border: 1px solid rgba(184,134,42,.3);
  font-size: .72rem; font-weight: 600;
  padding: 4px 12px; border-radius: 20px;
}

.content { padding: 28px 32px; max-width: 800px; }

/* Steps */
.steps { display: flex; align-items: center; margin-bottom: 28px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--border); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700; flex-shrink: 0;
  transition: all .3s;
}
.step.done .step-num { background: #22c55e; color: white; }
.step.active .step-num { background: var(--gold); color: white; }
.step-label { font-size: .78rem; color: var(--muted); }
.step.active .step-label { color: var(--gold); font-weight: 600; }
.step.done .step-label { color: var(--ink); }
.step-line { flex: 1; height: 1px; background: var(--border); margin: 0 10px; min-width: 30px; }

/* Cards */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.card-title {
  font-family: 'Noto Serif KR', serif;
  font-size: .9rem; font-weight: 600; color: var(--ink);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}

/* Form */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
input, select, textarea {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: .88rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,134,42,.1);
}
textarea { resize: vertical; min-height: 80px; line-height: 1.7; }

/* Tags */
.tag-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: .78rem; color: var(--muted);
  cursor: pointer; transition: all .15s;
  background: var(--surface);
}
.tag:hover { border-color: var(--gold); color: var(--gold); }
.tag.on { background: var(--gold-light); border-color: var(--gold); color: var(--gold); font-weight: 600; }

/* Buttons */
.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: white;
  border: none; border-radius: 10px;
  font-family: 'Noto Serif KR', serif;
  font-size: 1rem; font-weight: 600;
  letter-spacing: .1em;
  cursor: pointer;
  transition: all .2s;
}
.btn-primary:hover { background: #6e1a1a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(139,32,32,.3); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-gold {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px;
  background: var(--gold);
  color: white; border: none; border-radius: 8px;
  font-family: 'Noto Serif KR', serif;
  font-size: .9rem; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-gold:hover { background: #9a6e20; transform: translateY(-1px); }

.btn-outline {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px;
  background: transparent;
  color: var(--muted); border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .84rem; cursor: pointer; transition: all .15s;
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }

/* Progress */
.progress-box {
  display: none;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 48px 24px;
  text-align: center;
  margin-bottom: 16px;
}
.progress-box.show { display: block; }
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  margin: 0 auto 20px;
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-box p { color: var(--muted); font-size: .9rem; }
.progress-box .sub { font-size: .8rem; margin-top: 6px; opacity: .7; }

/* Result */
.result-area { display: none; }
.result-area.show { display: block; }
.result-preview {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  max-height: 500px;
  overflow-y: auto;
  font-size: .84rem;
  line-height: 1.9;
  color: var(--ink);
  white-space: pre-wrap;
  margin-bottom: 16px;
}
.result-preview strong { color: var(--red); }
.action-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Pillars */
.pillars-mini { display: flex; gap: 8px; margin-bottom: 16px; }
.pill { text-align: center; }
.pill-card {
  width: 48px;
  border: 1.5px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.pill-s { background: var(--red); color: white; font-family: 'Noto Serif KR', serif; font-size: 1rem; padding: 7px 0; text-align: center; }
.pill-b { background: var(--gold-light); color: var(--ink); font-family: 'Noto Serif KR', serif; font-size: 1rem; padding: 7px 0; text-align: center; border-top: 1px solid var(--border); }
.pill-label { font-size: .65rem; color: var(--muted); margin-top: 3px; }

@media (max-width: 640px) {
  .sidebar { display: none; }
  .content { padding: 16px; }
  .form-row { grid-template-columns: 1fr; }
  .topbar { padding: 14px 16px; }
}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="sidebar-header">
    <img src="/logo.png" alt="사주한장">
    <div class="brand-text">
      <h2>사주한장</h2>
      <span>운영자 전용</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" id="navNew">
      <span class="icon">✦</span> 새 풀이 생성
    </div>
    <div class="nav-item" id="navHistory">
      <span class="icon">📋</span> 생성 기록
    </div>
  </nav>
  <div class="sidebar-footer">사주한장 · v2.0</div>
</aside>

<div class="main">
  <div class="topbar">
    <h1>사주 풀이 생성</h1>
    <span class="badge">✦ AI 리포트 자동 생성</span>
  </div>

  <div class="content">

    <!-- 진행 단계 -->
    <div class="steps">
      <div class="step active" id="step1">
        <div class="step-num">1</div>
        <div class="step-label">정보 입력</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step2">
        <div class="step-num">2</div>
        <div class="step-label">AI 분석</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step3">
        <div class="step-num">3</div>
        <div class="step-label">PDF 생성</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step4">
        <div class="step-num">4</div>
        <div class="step-label">전달</div>
      </div>
    </div>

    <!-- 입력 폼 -->
    <div id="formSection">

      <div class="card">
        <div class="card-title">👤 의뢰인 기본 정보</div>
        <div class="form-row">
          <div class="form-group">
            <label>이름</label>
            <input type="text" id="name" placeholder="홍길동">
          </div>
          <div class="form-group">
            <label>성별</label>
            <select id="gender">
              <option value="남">남성</option>
              <option value="여">여성</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="birth" max="2010-12-31">
          </div>
          <div class="form-group">
            <label>출생 시간</label>
            <select id="btime">
              <option value="모름">모름 / 불분명</option>
              <option value="자시(23~01시)">자시 (밤 11~1시)</option>
              <option value="축시(01~03시)">축시 (새벽 1~3시)</option>
              <option value="인시(03~05시)">인시 (새벽 3~5시)</option>
              <option value="묘시(05~07시)">묘시 (새벽 5~7시)</option>
              <option value="진시(07~09시)">진시 (오전 7~9시)</option>
              <option value="사시(09~11시)">사시 (오전 9~11시)</option>
              <option value="오시(11~13시)">오시 (오전 11~오후 1시)</option>
              <option value="미시(13~15시)">미시 (오후 1~3시)</option>
              <option value="신시(15~17시)">신시 (오후 3~5시)</option>
              <option value="유시(17~19시)">유시 (오후 5~7시)</option>
              <option value="술시(19~21시)">술시 (저녁 7~9시)</option>
              <option value="해시(21~23시)">해시 (밤 9~11시)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🎯 관심 분야 (복수 선택)</div>
        <div class="tag-wrap" id="tagWrap">
          <span class="tag on" data-v="전체">🌟 전체운</span>
          <span class="tag" data-v="재물">💰 재물운</span>
          <span class="tag" data-v="연애·결혼">❤️ 연애·결혼</span>
          <span class="tag" data-v="직업·사업">💼 직업·사업</span>
          <span class="tag" data-v="건강">🌿 건강운</span>
          <span class="tag" data-v="가족">🏠 가족운</span>
          <span class="tag" data-v="올해운세">📅 올해운세</span>
          <span class="tag" data-v="이사·이직">🔄 이사·이직</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">💬 의뢰인 고민 메모 (선택)</div>
        <div class="form-group">
          <label>당근 채팅에서 받은 고민 — 많이 적을수록 더 정확하게 분석됩니다</label>
          <textarea id="memo" placeholder="예: 올해 이직을 고민 중이에요. 현재 직장에서 5년째 일하고 있는데 사업을 시작하고 싶어요. 연애도 잘 안 풀리고..."></textarea>
        </div>
      </div>

      <button class="btn-primary" onclick="generate()">
        ✦ AI 사주 리포트 생성하기
      </button>
    </div>

    <!-- 로딩 -->
    <div class="progress-box" id="progBox">
      <div class="spinner"></div>
      <p>사주를 분석하고 있습니다…</p>
      <p class="sub" id="progSub">사주팔자 계산 중</p>
    </div>

    <!-- 결과 -->
    <div class="result-area" id="resultArea">
      <div class="card">
        <div class="card-title">
          ✅ 생성 완료 —
          <span id="resName" style="color:var(--ink);font-weight:700;"></span>님 사주 리포트
        </div>
        <div class="pillars-mini" id="pillarsPreview"></div>
        <div class="result-preview" id="resPreview"></div>
        <div class="action-row">
          <button class="btn-gold" onclick="downloadPDF()">
            📄 PDF 다운로드
          </button>
          <button class="btn-outline" onclick="resetAll()">
            ↺ 새 의뢰인
          </button>
        </div>
        <p style="margin-top:12px;font-size:.74rem;color:var(--muted);">
          💡 PDF를 저장 후 카카오톡으로 전송하세요.
        </p>
      </div>
    </div>

  </div>
</div>
</div>

<script src="/main.js"></script>
</body>
</html>
